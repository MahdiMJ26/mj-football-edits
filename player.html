
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیکن | MJ FOOTBALL EDITS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #06100b;
      color: #f2fff5;
      font-family: Tahoma, Arial, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .top {
      padding: 22px 6%;
      background: #0b1c12;
      border-bottom: 1px solid #1c6d3b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { color: #39ff78; font-size: 21px; font-weight: bold; }
    .home {
      padding: 10px 16px;
      border: 1px solid #39ff78;
      border-radius: 9px;
    }
    .container { width: min(1050px, 92%); margin: 30px auto; }
    .hero {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 25px;
      background: #0b1c12;
      border: 1px solid #205b35;
      border-radius: 18px;
      padding: 24px;
    }
    .photo {
      width: 100%;
      height: 330px;
      object-fit: cover;
      border-radius: 13px;
      background: #12281a;
    }
    .badge { color: #39ff78; font-weight: bold; letter-spacing: 2px; }
    h1 { margin: 12px 0 4px; font-size: 34px; }
    .english { color: #9fb9a6; direction: ltr; text-align: right; }
    .desc { color: #c7ddce; line-height: 2; }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .detail {
      background: #102719;
      border-radius: 9px;
      padding: 13px;
      line-height: 1.8;
    }
    .detail b { color: #39ff78; display: block; }
    section {
      margin-top: 28px;
      padding: 23px;
      background: #0b1c12;
      border: 1px solid #205b35;
      border-radius: 16px;
    }
    h2 { color: #39ff78; margin-top: 0; }
    .items { display: grid; gap: 12px; }
    .item {
      padding: 15px;
      background: #102719;
      border-radius: 10px;
      line-height: 1.9;
    }
    .video a { color: #39ff78; text-decoration: underline; }
    .muted { color: #a6b9aa; }
    footer { text-align: center; color: #8da394; padding: 30px; }
    @media (max-width: 650px) {
      .hero { grid-template-columns: 1fr; padding: 16px; }
      .photo { height: 300px; }
      h1 { font-size: 27px; }
      .details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="logo" href="index.html">MJ FOOTBALL EDITS</a>
    <a class="home" href="index.html">برگشت به خانه ←</a>
  </header>

  <main class="container">
    <div id="profile">در حال بارگذاری اطلاعات بازیکن...</div>

    <section>
      <h2>🏆 افتخارات</h2>
      <div class="items" id="honours"></div>
    </section>

    <section>
      <h2>📖 مسیر فوتبالی</h2>
      <div class="items" id="timeline"></div>
    </section>

    <section>
      <h2>🎬 ویدیوها</h2>
      <div class="items" id="videos">
        <p class="muted">در حال دریافت ویدیوها...</p>
      </div>
    </section>
  </main>

  <footer>© MJ FOOTBALL EDITS</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="players.js"></script>
  <script>
    const SUPABASE_URL = "https://prgdwprzvgtrlkemmuoc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0y5J9h5NnN-7G0rtsG_RTA_xo4mFP8T";

    const playerId = new URLSearchParams(location.search).get("id");
    const player = players.find(p => p.id === playerId);
    const profile = document.getElementById("profile");

    function safeText(value) {
      const el = document.createElement("span");
      el.textContent = value ?? "";
      return el.innerHTML;
    }

    if (!player) {
      profile.innerHTML = `
        <section>
          <h1>بازیکن پیدا نشد!</h1>
          <p>آدرس صفحه یا شناسهٔ بازیکن درست نیست.</p>
          <a href="index.html">برگشت به خانه</a>
        </section>`;
      document.getElementById("honours").innerHTML = "";
      document.getElementById("timeline").innerHTML = "";
      document.getElementById("videos").innerHTML = "";
    } else {
      document.title = player.name + " | MJ FOOTBALL EDITS";

      profile.innerHTML = `
        <article class="hero">
          <img class="photo" src="${safeText(player.image)}"
               alt="${safeText(player.name)}"
               onerror="this.style.display='none'">
          <div>
            <div class="badge">${safeText(player.badge)}</div>
            <h1>${safeText(player.name)}</h1>
            <div class="english">${safeText(player.englishName)}</div>
            <p class="desc">${safeText(player.description)}</p>
            <p class="desc">${safeText(player.bio)}</p>
            <div class="details">
              <div class="detail"><b>ملیت</b>${safeText(player.nationality)}</div>
              <div class="detail"><b>تاریخ تولد</b>${safeText(player.birth)}</div>
              <div class="detail"><b>پست</b>${safeText(player.position)}</div>
              <div class="detail"><b>باشگاه</b>${safeText(player.club)}</div>
              <div class="detail"><b>شماره پیراهن</b>${safeText(player.number)}</div>
            </div>
          </div>
        </article>`;

      document.getElementById("honours").innerHTML =
        player.honours.map(x => `<div class="item">🏆 ${safeText(x)}</div>`).join("");

      document.getElementById("timeline").innerHTML =
        player.timeline.map(x => `<div class="item">⚽ ${safeText(x)}</div>`).join("");

      async function loadVideos() {
        const box = document.getElementById("videos");

        if (!window.supabase) {
          box.innerHTML = '<p class="muted">سرویس ویدیو بارگذاری نشد.</p>';
          return;
        }

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await client
          .from("videos")
          .select("id, title, video_url, created_at")
          .eq("player", player.id)
          .order("created_at", { ascending: false });

        if (error) {
          box.innerHTML = '<p class="muted">دریافت ویدیوها ناموفق بود. تنظیمات Supabase را بررسی کن.</p>';
          console.error(error);
          return;
        }

        if (!data || data.length === 0) {
          box.innerHTML = '<p class="muted">هنوز ویدیویی برای این بازیکن ثبت نشده است.</p>';
          return;
        }

        box.innerHTML = data.map(video => `
          <div class="item video">
            <strong>${safeText(video.title || "ویدیو بدون عنوان")}</strong>
            <p><a href="${safeText(video.video_url)}" target="_blank" rel="noopener noreferrer">▶ مشاهده ویدیو</a></p>
          </div>
        `).join("");
      }

      loadVideos();
    }
  </script>
</body>
</html>
