<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050805">
    <title>MJ FOOTBALL EDITS</title>

    <style>
        :root {
            --neon: #39ff14;
            --bg: #050805;
            --card: #0a110a;
            --text: #f2fff0;
            --muted: #a7b8a4;
            --border: rgba(57, 255, 20, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 20px;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
        }

        /* صفحه شروع */

        #mj-intro {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle, #102510, #050805 65%, #020302);
            transition: opacity 0.7s ease, visibility 0.7s ease;
            cursor: pointer;
        }

        #mj-intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .mj-logo {
            direction: ltr;
            font-family: Arial, sans-serif;
            font-size: clamp(90px, 20vw, 170px);
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon),
                         0 0 30px rgba(57,255,20,.8),
                         0 0 70px rgba(57,255,20,.4);
            animation: logoReveal 1s ease both,
                       logoPulse 1.2s ease-in-out 1s infinite alternate;
